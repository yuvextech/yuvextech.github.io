    <!-- Loading Screen -->
    <div id="loader" style="position:fixed;inset:0;z-index:9999;background:#fff dark:bg-[#030712];display:flex;align-items:center;justify-content:center;transition:opacity 0.5s ease-out;">
        <div style="width:48px;height:48px;border:3px solid #e5e7eb dark:border-white/10;border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite;" role="status" aria-label="Loading"></div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>

    <div id="root"></div>

    <!-- Theme Toggle Script (runs before React mounts) -->
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('yuvex_theme');
                if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch(e) {}
            // Remove loader once DOM is ready
            document.addEventListener('DOMContentLoaded', function() {
                var loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(function() { loader.remove(); }, 500);
                }
            });
        })();
    </script>
